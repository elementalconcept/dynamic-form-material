@if (visible && config && formGroup) {
  <mat-form-field
    [formGroup]="formGroup"
    [floatLabel]="config.meta?.floatLabel"
    [appearance]="config.meta?.appearance"
    [hintLabel]="config.meta?.hintLabel"
    [hideRequiredMarker]="config.meta?.hideRequiredMarker"
    [ngClass]="config.meta?.cssClass"
    [color]="config.meta?.color">
    <mat-label>{{ transform(config.label) }}</mat-label>
    <input [attr.type]="inputType"
      [attr.inputmode]="inputMode"
      [placeholder]="transform(config.placeholder)"
      [required]="required"
      [formControlName]="config.id"
      matInput>
      @if (config.meta?.suffix === SuffixType.password) {
        <button
          (click)="onPasswordToggle($event)"
          matSuffix
          mat-icon-button
          type="button">
          <mat-icon>{{ inputType === 'password' ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      }
      @for (error of errors; track error) {
        <mat-error>{{ transform(config.errors[ error ]) }}</mat-error>
      }
    </mat-form-field>
  }
