@if (visible && !dynamicFormElement?.meta?.sectionTitle) {
  <div
    [innerHTML]="transform(dynamicFormElement?.meta?.htmlDescription)">
  </div>
}

@if (visible && dynamicFormElement?.meta?.sectionTitle === true) {
  <h5 class="section-title">
    {{ transform(dynamicFormElement?.label) }}
  </h5>
}
