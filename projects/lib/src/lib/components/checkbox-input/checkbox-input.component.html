@if (visible && config && formGroup) {
  <div
    [formGroup]="formGroup"
    [ngClass]="config.meta?.cssClass">
    <mat-checkbox [formControlName]="config.id"
      [labelPosition]="config.meta?.labelPosition"
      [color]="config.meta?.color">
      {{ transform(config.label) }}@if (required && !config.meta?.hideRequiredMarker) {
      <span class="required-mark">*</span>
    }
    @if (config.meta?.externalLink) {
      <a
        [href]="config.meta?.externalLink.url"
        (click)="openExternalLink($event)"
        target="_blank">
        {{ transform(config.meta?.externalLink.label) }}
      </a>
    }
  </mat-checkbox>
  @for (error of errors; track error) {
    <mat-error>{{ transform(config.errors[ error ]) }}</mat-error>
  }
</div>
}
